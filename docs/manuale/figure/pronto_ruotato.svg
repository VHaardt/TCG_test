<svg viewBox="0 0 660 200" role="img" aria-label="Carta dritta e carta ruotata" class="fig-svg">
  <g transform="translate(30,20)">
    <rect width="96" height="134" rx="9" class="carta-f"/>
    <text x="48" y="72" text-anchor="middle" class="t-tit">Dritta</text>
    <text x="120" y="40" class="t-b">Pronta</text>
    <text x="120" y="62">può attaccare</text>
    <text x="120" y="82">può opporsi</text>
    <text x="120" y="102">può usare ⟳</text>
  </g>
  <g transform="translate(340,40)">
    <rect width="134" height="96" rx="9" class="carta-f" style="fill:var(--carta)"/>
    <text x="67" y="54" text-anchor="middle" class="t-tit">Ruotata</text>
    <text x="154" y="20" class="t-b">Ha già agito</text>
    <text x="154" y="42">non attacca</text>
    <text x="154" y="62">non si oppone</text>
    <text x="154" y="82">non usa ⟳</text>
  </g>
  <text x="30" y="186" class="t-tenue">Si raddrizza nel Ripristino del suo controllore. Ruotata non vuol dire attaccabile.</text>
</svg>
