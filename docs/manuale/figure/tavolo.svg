<svg viewBox="0 0 780 470" role="img" aria-label="Schema del tavolo di un giocatore" class="fig-svg">
  <!-- centro del tavolo -->
  <rect x="10" y="10" width="760" height="64" rx="10" class="zona-tratt"/>
  <text x="26" y="34" class="t-tit">Centro del tavolo · in comune</text>
  <text x="26" y="56" class="t-tenue">scorta di gemme · tracciato del round · impegno durante gli attacchi</text>
  <g transform="translate(470,26)">
    <circle cx="10" cy="16" r="8" class="gemma"/><circle cx="28" cy="16" r="8" class="gemma"/><circle cx="46" cy="16" r="8" class="gemma"/><circle cx="19" cy="2" r="8" class="gemma"/><circle cx="37" cy="2" r="8" class="gemma"/>
    <text x="64" y="22" class="t-tenue">scorta</text>
    <rect x="120" y="-6" width="160" height="30" rx="5" class="riq-neutro"/>
    <text x="134" y="15" class="t-b">1 2 3 4 … 15</text><circle cx="234" cy="9" r="6" class="gemma-g"/>
    <text x="246" y="15" class="t-tenue">round</text>
  </g>
  <!-- Campo -->
  <text x="20" y="104" class="t-tit">Campo</text>
  <text x="90" y="104" class="t-tenue">Unità, massimo {{max_units}}</text>
  <g transform="translate(20,114)">
    <rect x="0" y="0" width="70" height="96" rx="7" class="carta-f"/><text x="35" y="44" text-anchor="middle" class="t-b">Unità</text><text x="35" y="62" text-anchor="middle" class="t-tenue">dritta</text>
    <g transform="translate(80,13)"><rect width="96" height="70" rx="7" class="carta-f"/><text x="48" y="32" text-anchor="middle" class="t-b">Unità</text><text x="48" y="50" text-anchor="middle" class="t-tenue">ruotata</text></g>
    <rect x="186" y="0" width="70" height="96" rx="7" class="zona-tratt"/>
    <rect x="266" y="0" width="70" height="96" rx="7" class="zona-tratt"/>
    <rect x="346" y="0" width="70" height="96" rx="7" class="zona-tratt"/>
  </g>
  <text x="560" y="104" class="t-tenue">Reliquie, massimo {{max_relics}}</text>
  <g transform="translate(560,114)">
    <rect x="0" y="0" width="70" height="96" rx="7" class="carta-f"/><text x="35" y="52" text-anchor="middle" class="t-b">Reliquia</text>
    <rect x="80" y="0" width="70" height="96" rx="7" class="zona-tratt"/>
  </g>
  <!-- Cicatrici -->
  <text x="20" y="252" class="t-tit t-cic">Cicatrici</text>
  <text x="20" y="270" class="t-tenue">pubbliche, a faccia in su</text>
  <g transform="translate(20,282)">
    <rect x="0" y="0" width="62" height="86" rx="6" class="carta-cic"/><text x="31" y="48" text-anchor="middle" class="t-tenue">dritta</text>
    <rect x="70" y="0" width="62" height="86" rx="6" class="carta-cic"/><text x="101" y="48" text-anchor="middle" class="t-tenue">dritta</text>
    <g transform="translate(142,12)"><rect width="86" height="62" rx="6" class="carta-cic"/><text x="43" y="36" text-anchor="middle" class="t-cic">fresca</text></g>
  </g>
  <!-- Leader + Vita -->
  <g transform="translate(300,236)">
    <rect x="10" y="22" width="110" height="150" rx="9" class="carta-dorso"/>
    <rect x="6" y="16" width="110" height="150" rx="9" class="carta-dorso"/>
    <rect x="2" y="10" width="110" height="150" rx="9" class="carta-dorso"/>
    <rect x="0" y="0" width="110" height="150" rx="9" class="carta-f"/>
    <text x="55" y="34" text-anchor="middle" class="t-tit">Leader</text>
    <text x="55" y="54" text-anchor="middle" class="t-tenue">sempre in gioco</text>
    <circle cx="38" cy="92" r="10" class="gemma"/><circle cx="72" cy="92" r="10" class="gemma"/>
    <text x="55" y="124" text-anchor="middle" class="t-dif">Guardia</text>
    <text x="55" y="140" text-anchor="middle" class="t-tenue">sul Leader</text>
  </g>
  <text x="434" y="388" class="t-tenue">Vita: {{life}} carte coperte</text>
  <text x="434" y="404" class="t-tenue">sotto il Leader</text>
  <!-- Mazzo e Scarti -->
  <g transform="translate(560,250)">
    <rect x="6" y="6" width="70" height="96" rx="7" class="carta-dorso"/><rect x="3" y="3" width="70" height="96" rx="7" class="carta-dorso"/><rect width="70" height="96" rx="7" class="carta-dorso"/>
    <text x="35" y="122" text-anchor="middle" class="t-b">Mazzo</text>
    <rect x="96" y="0" width="70" height="96" rx="7" class="carta-f"/>
    <text x="131" y="122" text-anchor="middle" class="t-b">Scarti</text>
  </g>
  <!-- Brace -->
  <g transform="translate(560,396)">
    <circle cx="12" cy="12" r="10" class="gemma"/><circle cx="36" cy="12" r="10" class="gemma"/><circle cx="60" cy="12" r="10" class="gemma"/>
    <text x="80" y="10" class="t-att">Brace</text>
    <text x="80" y="26" class="t-tenue">davanti a te, nel tuo turno</text>
  </g>
  <!-- Mano -->
  <g transform="translate(150,404)">
    <rect x="0" y="0" width="40" height="56" rx="5" class="carta-dorso" transform="rotate(-12 20 56)"/>
    <rect x="24" y="0" width="40" height="56" rx="5" class="carta-dorso" transform="rotate(-4 44 56)"/>
    <rect x="48" y="0" width="40" height="56" rx="5" class="carta-dorso" transform="rotate(4 68 56)"/>
    <rect x="72" y="0" width="40" height="56" rx="5" class="carta-dorso" transform="rotate(12 92 56)"/>
  </g>
  <text x="20" y="430" class="t-b">Mano</text>
  <text x="20" y="448" class="t-tenue">solo tu la vedi</text>
  <text x="300" y="455" class="t-tenue">↓ il tuo lato del tavolo</text>
</svg>
