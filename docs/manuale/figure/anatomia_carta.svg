  <g transform="translate(215,14)">
    <rect width="230" height="320" rx="14" class="carta-f"/>
    <circle cx="30" cy="30" r="20" class="gemma"/><text x="30" y="37" text-anchor="middle" class="t-tit" style="font-size:20px">1</text>
    <text x="60" y="26" class="t-b">ROS-001</text>
    <text x="60" y="44" class="t-tenue">Unità · Rosso</text>
    <circle cx="206" cy="30" r="8" style="fill:var(--c-rosso)"/>
    <rect x="16" y="64" width="198" height="110" rx="8" class="zona"/>
