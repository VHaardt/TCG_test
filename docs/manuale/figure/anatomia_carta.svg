  <text x="470" y="34" class="t-b">ID, tipo e colore</text><text x="470" y="52" class="t-tenue">massimo 3 copie per ID</text>
  <path d="M466,40 L388,40" class="freccia" marker-end="url(#punta-ana)"/>
  <text x="20" y="206" class="t-b">Parole chiave e testo</text><text x="20" y="224" class="t-tenue">il corsivo ricorda la regola</text>
  <path d="M168,212 L224,212" class="freccia" marker-end="url(#punta-ana)"/>
  <text x="470" y="282" class="t-b">Forza</text><text x="470" y="300" class="t-tenue">attacco e difesa</text>
  <path d="M466,288 L436,288" class="freccia" marker-end="url(#punta-ana)"/>
