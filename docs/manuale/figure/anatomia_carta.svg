    <text x="16" y="200" class="t-b">Assalto.</text>
    <text x="16" y="220" class="t-b">Impeto 1: +2</text>
    <text x="16" y="240" class="t-tenue">con almeno 1 gemma impegnata,</text>
    <text x="16" y="256" class="t-tenue">+2 in questo scontro</text>
